<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro de Facturas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('clark_forklift_green.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 10px;
      margin: 0;
    }

    .container {
      max-width: 700px;
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.6rem;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 14px;
      font-size: 0.95rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 22px;
      padding: 14px;
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    img {
      max-width: 180px;
      width: 100%;
      height: auto;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }

      .container {
        padding: 16px;
        border-radius: 10px;
      }

      label {
        font-size: 0.9rem;
      }

      button {
        font-size: 1rem;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="text-align:center; margin-bottom:20px;">
      <img src="Logo_Magrinsa_org.png" alt="Logo" style="max-width:220px; width:100%;" />
    </div>
    <h1>Registro de Facturas</h1>

    <form id="invoiceForm">
      <label>Proyecto</label>
      <select required>
        <option value="">Seleccione un proyecto</option>
        <option>CORBEL</option>
        <option>GUARCO</option>
        <option>ALFICAR</option>
        <option>SIGMA ALAJUELA</option>
        <option>SIGMA CARTAGO</option>
        <option>SAE SPINNING</option>
        <option>OTRO</option>
      </select>

      <label>Nombre del usuario</label>
      <select required>
        <option value="">Seleccione un usuario</option>
        <option>BRYAN CALERO</option>
        <option>JUAN CARLOS ROLDAN</option>
        <option>EDWIN ANGULO</option>
        <option>ELIUTH VALLE</option>
        <option>NELSON QUESADA</option>
        <option>LUIS A. VARGAS</option>
      </select>

      
      <label>Número de factura</label>
      <input type="text" required />

      <label>Fecha de la factura</label>
      <input type="date" required />

      

      <label>Monto total</label>
      <input type="number" step="0.01" required />

      

      <label>Categoría</label>
      <select>
        <option>Servicios</option>
        <option>Repuestos</option>
        <option>Combustible</option>
        <option>Otros</option>
        <option>Desayuno</option>
        <option>Almuerzo</option>
        <option>Cena</option>
        <option>Hospedaje</option>
        <option>Pago por limpieza</option>
        <option>Compra de repuestos</option>
        <option>Compra de consumibles</option>
        <option>Pago de fletes - UBER</option>
        <option>Compras de oficina</option>
      </select>

      <label>Observaciones</label>
      <textarea rows="4"></textarea>

      <button type="submit">Guardar registro</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('invoiceForm');
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby5wa8k3jiMvAVeqfsmwPcB82GYS2vrjeN1Ny8oSxiGXhiP3Ue6Q2xA2JtwOtvfCKVR/exec";

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const selects = form.querySelectorAll('select');
      const inputs = form.querySelectorAll('input');
      const textarea = form.querySelector('textarea');

      const data = {
        proyecto: selects[0].value,
        usuario: selects[1].value,
        factura: inputs[0].value,
        fecha: inputs[1].value,
        monto: inputs[2].value,
        categoria: selects[2].value,
        observaciones: textarea.value
      };

      fetch(WEBHOOK_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(() => {
        alert('Factura registrada correctamente en el sistema centralizado');
        form.reset();
      })
      .catch(() => {
        alert('Error al registrar la factura. Intente nuevamente.');
      });
    });
  </script>
</body>
</html>
